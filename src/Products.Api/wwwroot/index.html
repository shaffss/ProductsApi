<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products API - produkty</title>
  <link rel="stylesheet" href="app.css">
  <!-- motyw wybrany przyciskiem przed pierwszym renderem (bez mignięcia); bez wyboru - motyw systemu -->
  <script>try { const theme = localStorage.getItem('theme'); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Produkty</h1>
    <span id="variant" class="badge" title="Wariant API (GET /health)"></span>
    <nav>
      <a href="/swagger">Swagger</a>
      <button id="theme" class="icon">
        <svg id="sun" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <button id="add" class="primary" title="Dodaj produkt">+ Dodaj</button>
      <button id="edit" class="icon" title="Zmień cenę zaznaczonego produktu (dwuklik na wierszu)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Edytuj
      </button>
      <!-- usuwanie wyłączone (decyzja biznesowa) - kod zakomentowany, nie usunięty
      <button id="delete" class="icon danger-outline" title="Usuń zaznaczony produkt (klawisz Delete)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        Usuń
      </button>
      -->
      <button id="refresh" title="Odśwież stronę">Odśwież</button>
      <label class="page-size">Na stronie
        <select id="take">
          <option>10</option><option selected>20</option><option>50</option><option>100</option>
        </select>
      </label>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Nazwa</th><th class="num">Cena</th><th>Waluta</th><th>Zmieniono</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <footer class="pager">
      <span id="range"></span>
      <div id="pages"></div>
      <label>Strona <input id="go" type="number" min="1" inputmode="numeric"></label>
    </footer>
  </main>

  <dialog id="product-dialog">
    <form method="dialog" novalidate>
      <h2 id="dialog-title"></h2>
      <p id="dialog-info" class="muted"></p>
      <label id="name-field">Nazwa <input name="name" maxlength="200" required><small data-error="name"></small></label>
      <label>Cena <input name="price" type="number" min="0.01" step="0.01" required><small data-error="price"></small></label>
      <label>Waluta
        <select name="currency"><option>PLN</option><option>EUR</option><option>USD</option></select>
        <small data-error="currency"></small>
      </label>
      <p class="error" data-error="form"></p>
      <menu>
        <button type="button" value="cancel">Anuluj</button>
        <button class="primary">Zapisz</button>
      </menu>
    </form>
  </dialog>

  <!-- usuwanie wyłączone (decyzja biznesowa) - kod zakomentowany, nie usunięty
  <dialog id="delete-dialog">
    <form method="dialog">
      <h2>Usunąć produkt?</h2>
      <p><strong id="delete-name"></strong> zostanie usunięty razem z historią cen.</p>
      <menu>
        <button value="cancel">Anuluj</button>
        <button value="delete" class="danger">Usuń</button>
      </menu>
    </form>
  </dialog>
  -->

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
