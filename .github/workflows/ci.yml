name: CI

on:
  push:
    branches: [main]
  pull_request:

# kolejny push do tej samej gałęzi przerywa poprzedni przebieg
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Products.slnx

      # styl i analizatory (.editorconfig, AnalysisLevel) - ostrzeżenia są błędami
      - name: Format
        run: dotnet format Products.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Products.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test --project tests/Products.UnitTests --configuration Release --no-build

      # SQL Server, PostgreSQL, Redis i Kafka w kontenerach (Testcontainers) - Docker jest na runnerze
      - name: Integration tests
        run: dotnet test --project tests/Products.IntegrationTests --configuration Release --no-build

      - name: Docker image
        run: docker build --file src/Products.Api/Dockerfile .
