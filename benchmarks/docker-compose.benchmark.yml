# Nakładka na docker-compose.yml do testów HTTP (k6) - mierzy API z bazą, bez cache, Kafki, telemetrii
# i logów Information (jednakowo we wszystkich wariantach):
#   docker compose -f docker-compose.yml -f benchmarks/docker-compose.benchmark.yml --profile efcore-postgres up -d
# Outbox jest dalej zapisywany (część zmiany ceny), ale nie wysyłany. Po pomiarach, póki działa baza, usuń dane
# z pomiarów: dotnet run -c Release --project benchmarks/Products.Benchmarks -- cleanup
# i kontenery: docker compose --profile "*" down

x-benchmark-environment: &benchmark-environment
  Cache__Enabled: "false"
  Kafka__Enabled: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  Logging__LogLevel__Default: Warning

services:
  api-efcore-postgres: { environment: *benchmark-environment }
  api-efcore-sqlserver: { environment: *benchmark-environment }
  api-dapper-postgres: { environment: *benchmark-environment }
  api-dapper-sqlserver: { environment: *benchmark-environment }
